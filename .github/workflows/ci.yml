name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Environment diagnostics
        run: python scripts/check_env.py
      - name: Lint
        run: ruff check .
      - name: Check formatting on changed Python files
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$BASE_SHA"
          elif [ "$EVENT_NAME" = "push" ]; then
            base="$BEFORE_SHA"
          else
            base="$(git rev-parse HEAD^ 2>/dev/null || true)"
          fi
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            changed="$(git ls-files '*.py')"
          else
            changed="$(git diff --name-only "$base" "$GITHUB_SHA" -- '*.py')"
          fi
          if [ -z "$changed" ]; then
            echo "No changed Python files."
          else
            printf '%s\n' "$changed" | xargs ruff format --check
          fi
      - name: Test with coverage
        run: python -m pytest --cov=skillcred --cov-report=term-missing --cov-report=xml
      - name: Build wheel and source distribution
        run: |
          python -m pip install build
          python -m build
      - name: Validate release metadata and packaged files
        run: python scripts/validate_release.py --artifact-dir dist
      - uses: actions/upload-artifact@v4
        with:
          name: skillcred-python-${{ matrix.python-version }}
          path: |
            dist/*.whl
            dist/*.tar.gz
            coverage.xml
          if-no-files-found: error

  container-build:
    name: Container build smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build --tag skillcred:ci .

  windows-compat:
    name: Windows compatibility smoke
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package and development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Run test suite
        run: python -m pytest -q
