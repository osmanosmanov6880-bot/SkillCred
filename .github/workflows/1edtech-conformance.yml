name: Official 1EdTech conformance (opt-in)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  conformance:
    if: ${{ vars.SKILLCRED_1EDTECH_SUITE_REPO != '' && vars.SKILLCRED_1EDTECH_SUITE_REF != '' && vars.SKILLCRED_1EDTECH_COMMAND != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.SKILLCRED_1EDTECH_SUITE_REPO }}
          ref: ${{ vars.SKILLCRED_1EDTECH_SUITE_REF }}
          path: 1edtech-suite
          persist-credentials: false
      - name: Install SkillCred checks
        run: python -m pip install -e '.[dev]'
      - name: Run authorized suite
        env:
          SKILLCRED_1EDTECH_SUITE_DIR: ${{ github.workspace }}/1edtech-suite
          SKILLCRED_1EDTECH_COMMAND: ${{ vars.SKILLCRED_1EDTECH_COMMAND }}
          SKILLCRED_COMPLIANCE_OUTPUT: ${{ github.workspace }}/official-suite.log
        run: ./1edtech/run.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: skillcred-official-conformance-log
          path: official-suite.log
          if-no-files-found: ignore
