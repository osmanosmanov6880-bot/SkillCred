name: Standards/interoperability report
description: Report interoperability findings.
title: "interop: "
labels: ["standards", "needs-triage"]
body:
  - type: input
    id: target
    attributes:
      label: Target standard/profile and version
    validations:
      required: true
  - type: input
    id: validator
    attributes:
      label: Validator/tool and version
    validations:
      required: true
  - type: dropdown
    id: result
    attributes:
      label: Result
      options: [Pass, Fail, Blocked, Unknown]
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence
      description: Do not upload real personal data, private credentials or secrets.
    validations:
      required: true
