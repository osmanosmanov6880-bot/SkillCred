[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skillcred"
version = "0.3.0"
description = "Open, local-first issuance and verification of skill credentials"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{name = "SkillCred contributors"}]
keywords = ["open-badges", "verifiable-credentials", "ed25519", "education"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security :: Cryptography",
]
dependencies = [
  "cryptography>=43.0",
  "fastapi>=0.115",
  "pydantic>=2.8",
  "prometheus-client>=0.20",
  "pyld>=2.0",
  "rfc8785>=0.1.4",
  "typer>=0.12",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["httpx>=0.27", "jsonschema>=4.22", "pre-commit>=3.8", "pytest>=8", "pytest-cov>=5", "ruff>=0.6"]
redis = ["redis>=5.0"]

[project.scripts]
skillcred = "skillcred.cli:app"

[tool.setuptools.packages.find]
include = ["skillcred*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"

[tool.coverage.run]
branch = true
source = ["skillcred"]
omit = ["skillcred/__main__.py"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["skillcred", "tests", "examples"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "S"]
ignore = ["B008", "S101", "S104", "S105", "S106", "S110", "S603", "S607"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
