# Example TLS reverse proxy; mount certificate/key from a secret manager.
limit_req_zone $binary_remote_addr zone=skillcred_general:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=skillcred_issue:10m rate=2r/s;
upstream skillcred_api { server skillcred:8000; keepalive 16; }
server {
    listen 443 ssl http2;
    server_name ${SKILLCRED_DOMAIN};
    ssl_certificate /run/secrets/tls_fullchain.pem;
    ssl_certificate_key /run/secrets/tls_privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    client_max_body_size 1m;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    location ~ ^/(docs|redoc)(/|$) { allow 10.0.0.0/8; allow 172.16.0.0/12; allow 192.168.0.0/16; deny all; proxy_pass http://skillcred_api; }
    location = /openapi.json { allow 10.0.0.0/8; allow 172.16.0.0/12; allow 192.168.0.0/16; deny all; proxy_pass http://skillcred_api; }
    location = /metrics { allow 10.0.0.0/8; allow 172.16.0.0/12; allow 192.168.0.0/16; deny all; proxy_pass http://skillcred_api; }
    location ^~ /metrics/impact { allow 10.0.0.0/8; allow 172.16.0.0/12; allow 192.168.0.0/16; deny all; proxy_pass http://skillcred_api; }
    location = /issue { limit_req zone=skillcred_issue burst=5 nodelay; proxy_pass http://skillcred_api; }
    location / { limit_req zone=skillcred_general burst=30 nodelay; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; proxy_set_header X-Forwarded-For $remote_addr; proxy_set_header Connection ""; proxy_pass http://skillcred_api; }
}
server { listen 80; server_name ${SKILLCRED_DOMAIN}; return 301 https://$host$request_uri; }
